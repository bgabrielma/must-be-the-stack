# Standalone Rails+Postgres shape mirroring .devcontainer/docker-compose.yml
# [ADR-0009], for running apps/api outside the devcontainer (e.g. the VPS).
# The frontend (apps/web) deploys separately to Cloudflare Pages, so it has
# no service here.
services:
  app:
    build: apps/api
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
