name: CI

on:
  push:
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-api

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build & typecheck
        working-directory: apps/web
        run: pnpm run build

      - name: Vitest
        working-directory: apps/web
        run: pnpm test
