name: E2E

# PR-review artifact, not a regression gate — see ADR-0013. Boots the real
# apps/api + apps/web (no mocking) and uploads screenshots/video/trace
# regardless of pass/fail, since reviewing the real thing is the point.
#
# Duplicates the Ruby/db setup ci.yml's test-api job also does, rather than
# reusing a composite action — flagged on PR #19 for a possible `setup-api`
# split once that lands (see ADR-0013's Consequences).
on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/api

      - name: Set up database
        working-directory: apps/api
        run: bin/rails db:create db:schema:load

      - name: Seed curriculum content + E2E fixture users/progress
        working-directory: apps/api
        run: bin/rails curriculum:seed_e2e

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: apps/e2e
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Runner images are ephemeral, so the OS-level shared libraries
      # (--with-deps) still need installing every run regardless of cache —
      # only the Chromium binary download itself is worth skipping on a hit.
      - name: Install Playwright (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/e2e
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E specs
        working-directory: apps/e2e
        run: pnpm test

      - name: Upload E2E artifacts (screenshots, video, trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/e2e/screenshots
            apps/e2e/test-results
            apps/e2e/playwright-report
          retention-days: 14
